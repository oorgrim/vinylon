{% extends 'layout/base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
    <link rel="stylesheet" href="{% static 'deps/css/mediaplayer.css' %}">
    <div class="media-body">
        <div class="song-list">
            {% for audio in audiofiles %}
                <div class="song">
                    <button onclick="sendValue('{{ audio.audio_file|escapejs }}')">Play</button>
                    <p>{{ audio.title }}</p>
                </div>
            {% endfor %}
        </div>
    </div>

    <div class="songplayer">
        <audio id="audio-player" controls>
            <source id="audio-source" src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <hr>
    <script src="{% static 'deps/js/mediaplayer.js' %}"></script>
{% endblock %}
